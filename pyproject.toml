[build-system]
requires = ["setuptools>=64", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "rlt-forests"
version = "0.2.0"
description = "Reinforcement Learning Trees: random forests for regression, classification, and survival analysis (Python port of the RLT R package)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]
authors = [{ name = "Ruoqing Zhu" }]
license = { text = "GPL-3.0-or-later" }
keywords = ["random-forest", "survival", "reinforcement-learning",
            "sklearn", "trees"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/teazrq/RLT-Python"
Source = "https://github.com/teazrq/RLT-Python"

[project.optional-dependencies]
test = ["pytest", "scikit-learn>=1.3", "pandas"]

[tool.setuptools]
packages = ["rlt"]
