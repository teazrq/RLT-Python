site_name: rlt
site_description: >-
  Reinforcement Learning Trees for Python: random forests with embedded-model
  variable selection and linear-combination splits, for regression,
  classification, and survival analysis.
site_url: https://teazrq.github.io/RLT-Python/
repo_url: https://github.com/teazrq/RLT-Python
repo_name: teazrq/RLT-Python
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - content.code.copy
    - content.tooltips
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials:
      - Get Started: tutorials/get-started.md
      - Regression: tutorials/regression-tutorial.md
      - Classification: tutorials/classification-tutorial.md
      - Survival: tutorials/survival-tutorial.md
  - Articles:
      - Model Workflows: articles/model-workflows.md
      - Variable Importance: articles/variable-importance.md
      - Linear Combinations: articles/linear-combinations.md
      - Survival Confidence Bands: articles/confidence-interval.md
      - Forest Kernel: articles/feature-kernel.md
      - Single Tree: articles/feature-single-tree.md
      - Seeds & Reproducibility: articles/feature-seed.md
  - Reference:
      - RLT_reg: reference/rlt_reg.md
      - RLT_cla: reference/rlt_cla.md
      - RLT_surv: reference/rlt_surv.md
      - get_surv_band: reference/get_surv_band.md
      - Comparing Python and R: reference/r-parity.md
      - Functionality and Tests: reference/alignment-coverage.md
  - R version: https://teazrq.github.io/RLT/
