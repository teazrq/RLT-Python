name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # mkdocs gh-deploy pushes to the gh-pages branch

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarmadillo-dev liblapack-dev \
            libopenblas-dev libomp-dev g++
      - name: Install package and docs deps
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11
          python -m pip install --no-build-isolation -e . matplotlib mkdocs mkdocs-material
      - name: Verify every docs code example runs
        run: python tools/verify_examples.py
      - name: Build docs (strict)
        run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --no-history
