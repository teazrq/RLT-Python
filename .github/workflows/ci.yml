name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read corrected R reference
        if: matrix.python-version == '3.12'
        id: reference
        run: echo "revision=$(python tools/check_r_reference.py --revision)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        if: matrix.python-version == '3.12'
        with:
          use-public-rspm: true
      - uses: actions/checkout@v5
        if: matrix.python-version == '3.12'
        with:
          repository: teazrq/RLT
          ref: ${{ steps.reference.outputs.revision }}
          path: r-reference
      - name: Verify and install corrected R reference
        if: matrix.python-version == '3.12'
        run: |
          python tools/check_r_reference.py r-reference
          Rscript -e 'install.packages(c("Rcpp", "RcppArmadillo", "dqrng", "BH", "sitmo"))'
          R CMD INSTALL r-reference
          Rscript -e 'library(RLT); cat("Live R reference:", find.package("RLT"), "version", as.character(packageVersion("RLT")), "\n")'
          echo "RLT_REQUIRE_R_TESTS=1" >> "$GITHUB_ENV"
          echo "RLT_REFERENCE_REVISION=${{ steps.reference.outputs.revision }}" >> "$GITHUB_ENV"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarmadillo-dev liblapack-dev \
            libopenblas-dev libomp-dev g++
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11
          python -m pip install --no-build-isolation -e . pytest scikit-learn threadpoolctl pandas
      - name: Test
        run: pytest tests/ -q -rs

  # macos/windows wheels via cibuildwheel (sdist builds need armadillo;
  # enable when publishing; kept minimal for now)
