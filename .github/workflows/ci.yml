name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libarmadillo-dev liblapack-dev \
            libopenblas-dev libomp-dev g++
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11
          python -m pip install --no-build-isolation -e . pytest scikit-learn threadpoolctl pandas
      - name: Test
        run: pytest tests/ -q

  # macos/windows wheels via cibuildwheel (sdist builds need armadillo;
  # enable when publishing; kept minimal for now)
